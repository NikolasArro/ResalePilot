spring:
  application:
    name: ResalePilot

  datasource:
    url: ${RESALEPILOT_DB_URL:jdbc:postgresql://localhost:5433/resalepilot}
    username: ${RESALEPILOT_DB_USERNAME:resalepilot}
    password: ${RESALEPILOT_DB_PASSWORD:resalepilot}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: ${RESALEPILOT_SERVER_PORT:8080}

logging:
  level:
    ee.nikolas.resalepilot: INFO

google:
  drive:
    enabled: ${GOOGLE_DRIVE_ENABLED:false}
    auth-mode: ${GOOGLE_DRIVE_AUTH_MODE:SERVICE_ACCOUNT}
    credentials-path: ${GOOGLE_DRIVE_CREDENTIALS_PATH:}
    oauth-client-secrets-path: ${GOOGLE_DRIVE_OAUTH_CLIENT_SECRETS_PATH:}
    oauth-tokens-directory: ${GOOGLE_DRIVE_OAUTH_TOKENS_DIRECTORY:./oauth/tokens}
    app-folder-id-path: ${GOOGLE_DRIVE_APP_FOLDER_ID_PATH:./oauth/resalepilot-drive-folder-id.txt}
    app-folder-name: ${GOOGLE_DRIVE_APP_FOLDER_NAME:ResalePilot}
    yaga-archive-upload-enabled: ${GOOGLE_DRIVE_YAGA_ARCHIVE_UPLOAD_ENABLED:false}
    diagnostic-enabled: ${GOOGLE_DRIVE_DIAGNOSTIC_ENABLED:false}

yaga:
  images:
    max-images: ${YAGA_IMAGES_MAX_IMAGES:6}
    max-file-size-bytes: ${YAGA_IMAGES_MAX_FILE_SIZE_BYTES:26214400}
    max-batch-size-bytes: ${YAGA_IMAGES_MAX_BATCH_SIZE_BYTES:104857600}
  publishing:
    enabled: ${YAGA_PUBLISHING_ENABLED:false}
    confirm-enabled: ${YAGA_PUBLISHING_CONFIRM_ENABLED:false}
    auth-state-path: ${YAGA_PUBLISHING_AUTH_STATE_PATH:../playwright/.auth/yaga-state.json}
    headless: ${YAGA_PUBLISHING_HEADLESS:false}
    slow-mo-ms: ${YAGA_PUBLISHING_SLOW_MO_MS:100}
    confirmation-ttl: ${YAGA_PUBLISHING_CONFIRMATION_TTL:10m}
    publish-data-poll-timeout: ${YAGA_PUBLISHING_DATA_POLL_TIMEOUT:30s}
    publish-data-poll-interval: ${YAGA_PUBLISHING_DATA_POLL_INTERVAL:2s}
    form-url: https://www.yaga.ee/muuk/lisa-toode
  hiding:
    enabled: ${YAGA_HIDING_ENABLED:false}
    confirm-enabled: ${YAGA_HIDING_CONFIRM_ENABLED:false}
    auth-state-path: ${YAGA_HIDING_AUTH_STATE_PATH:../playwright/.auth/yaga-state.json}
    headless: ${YAGA_HIDING_HEADLESS:false}
    slow-mo-ms: ${YAGA_HIDING_SLOW_MO_MS:100}
    confirmation-ttl: ${YAGA_HIDING_CONFIRMATION_TTL:10m}
    hide-data-poll-timeout: ${YAGA_HIDING_DATA_POLL_TIMEOUT:30s}
    hide-data-poll-interval: ${YAGA_HIDING_DATA_POLL_INTERVAL:2s}
    management-url-template: ${YAGA_HIDING_MANAGEMENT_URL_TEMPLATE:https://www.yaga.ee/{shopSlug}/toode/{productSlug}}
  refresh:
    enabled: ${YAGA_REFRESH_ENABLED:false}
    execution-enabled: ${YAGA_REFRESH_EXECUTION_ENABLED:false}
    mode: ${YAGA_REFRESH_MODE:DRY_RUN}
    batch-size: ${YAGA_REFRESH_BATCH_SIZE:10}
    schedule-type: ${YAGA_REFRESH_SCHEDULE_TYPE:FIXED_DELAY}
    fixed-delay: ${YAGA_REFRESH_FIXED_DELAY:1d}
    cron: ${YAGA_REFRESH_CRON:0 0 3 * * *}
    zone: ${YAGA_REFRESH_ZONE:Europe/Tallinn}
    max-batch-size: ${YAGA_REFRESH_MAX_BATCH_SIZE:50}
  shop-discovery:
    enabled: ${YAGA_SHOP_DISCOVERY_ENABLED:false}
    max-pages: ${YAGA_SHOP_DISCOVERY_MAX_PAGES:100}
    max-listings: ${YAGA_SHOP_DISCOVERY_MAX_LISTINGS:1000}
    api-page-size: ${YAGA_SHOP_DISCOVERY_API_PAGE_SIZE:40}
    request-delay: ${YAGA_SHOP_DISCOVERY_REQUEST_DELAY:500ms}
    request-timeout: ${YAGA_SHOP_DISCOVERY_REQUEST_TIMEOUT:15s}
  shop-import:
    enabled: ${YAGA_SHOP_IMPORT_ENABLED:false}
    default-max-items: ${YAGA_SHOP_IMPORT_DEFAULT_MAX_ITEMS:10}
    max-items: ${YAGA_SHOP_IMPORT_MAX_ITEMS:100}
  batch-archive:
    enabled: ${YAGA_BATCH_ARCHIVE_ENABLED:false}
    default-max-listings: ${YAGA_BATCH_ARCHIVE_DEFAULT_MAX_LISTINGS:10}
    max-listings: ${YAGA_BATCH_ARCHIVE_MAX_LISTINGS:100}
